<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'HanyangHaeseo';
    src: url('/fonts/UNI_HSR_subset.woff2?v=2') format('woff2'),
         url('/fonts/UNI_HSR_subset.ttf?v=2') format('truetype');
  }

  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'HanyangHaeseo', '궁서', 'Gungsuh', 'GungsuhChe', 'Batang', serif;
    background: #fff;
    width: 210mm;
    height: 297mm;
    position: relative;
    overflow: hidden;
    color: #111;
  }

  .abs { position: absolute; z-index: 3; }

  /* ═══════ 作名證 title — far right ═══════ */
  .zone-title {
    right: 18mm;
    top: 54mm;
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 64pt;
    font-weight: 900;
    color: #111;
    letter-spacing: 0.1em;
    line-height: 1;
    font-family: 'HanyangHaeseo', '궁서', serif;
  }

  /* ═══════ Birth info — right center ═══════ */
  .zone-birth {
    right: 47mm;
    top: 48mm;
    display: flex;
    flex-direction: column;
    gap: 3mm;
  }
  .birth-seg {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 1mm;
  }
  .bko {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 12pt;
    color: #666;
    letter-spacing: 0.05em;
    line-height: 1.4;
    min-width: 5mm;
  }
  .bhan {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 25pt;
    font-weight: 700;
    color: #111;
    line-height: 1.4;
    font-family: 'HanyangHaeseo', '궁서', serif;
  }

  /* ═══════ Saju pillars — top center ═══════ */
  .zone-palja {
    top: 48mm;
    left: 74mm;
    display: flex;
    flex-direction: row;
    gap: 0;
  }
  .pillar-block {
    width: 12mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0.8mm;
  }

  .pillar-header {
    font-size: 6pt;
    color: #aaa;
    letter-spacing: 0.04em;
    margin-bottom: 1.5mm;
  }
  .p-unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0.3mm 0;
  }
  .p-ko  { font-size: 12pt; color: #888; line-height: 1.3; }
  .p-han { font-size: 20pt; font-weight: 700; color: #111; line-height: 1.05; font-family: 'HanyangHaeseo', '궁서', serif; }
  .p-empty { font-size: 20pt; color: #ddd; line-height: 1.05; }

  /* ═══════ Name chars — center, vertical stack ═══════ */
  .zone-name {
    top: 80mm;
    left: 70mm;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .name-section-label {
    font-size: 8pt;
    color: #a08040;
    letter-spacing: 0.5em;
    margin-bottom: 2mm;
    align-self: center;
    padding-left: 11mm;
  }
  .name-char-row {
    display: flex;
    flex-direction: row;
    align-items: center;
  }
  .name-han-big {
    font-size: 110pt;
    font-weight: 900;
    color: #111;
    line-height: 1.05;
    display: block;
    font-family: 'HanyangHaeseo', '궁서', serif;
  }
  .ann-left {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 12pt;
    color: #444;
    letter-spacing: 0.15em;
    margin-right: 2mm;
    align-self: center;
  }
  .ann-strokes-h {
    text-combine-upright: all;
  }
  .stroke-aside {
    writing-mode: horizontal-tb;
    font-size: 10pt;
    color: #444;
    margin-right: 2mm;
    align-self: center;
    white-space: nowrap;
  }

  /* ═══════ Deokdam virtues — left side ═══════ */
  .zone-deokdam {
    top: 44mm;
    left: 13mm;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .dd-section-label {
    font-size: 7.5pt;
    color: #a08040;
    letter-spacing: 0.4em;
    margin-bottom: 3mm;
    padding-bottom: 2mm;
    border-bottom: 0.6px solid #c9a84c;
  }
  .dd-list { display: flex; flex-direction: column; gap: 4mm; }
  .dd-row-group { display: flex; flex-direction: row; gap: 3mm; }
  .deokdam-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 1mm;
  }
  .dd-ko-side {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 12pt;
    color: #888;
    letter-spacing: 1.0em;
    line-height: 1.3;
    min-width: 5mm;
    align-self: center;
  }
  .dd-han-vert {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 25pt;
    font-weight: 800;
    color: #111;
    letter-spacing: 0.06em;
    line-height: 1.2;
    font-family: 'HanyangHaeseo', '궁서', serif;
  }

</style>
</head>
<body>



<!-- 作名證 title -->
<div class="abs zone-title">{{cert_title}}</div>

<!-- Birth info -->
<div class="abs zone-birth">
  <div class="birth-seg"><span class="bko">{{birth_year_ko}}</span><span class="bhan">{{birth_year_gapja}}年</span></div>
  <div class="birth-seg"><span class="bko">양력</span><span class="bhan">陽曆</span></div>
  <div class="birth-seg"><span class="bko">{{birth_month_ko}}</span><span class="bhan">{{birth_month_han}}</span></div>
  <div class="birth-seg"><span class="bko">{{birth_day_ko}}</span><span class="bhan">{{birth_day_han}}</span></div>
  <div class="birth-seg"><span class="bko">{{birth_hour_ko}}</span><span class="bhan">{{birth_shi_han}}</span></div>
  <div class="birth-seg"><span class="bko">탄생</span><span class="bhan">誕生</span></div>
</div>

<!-- Saju pillars -->
<div class="abs zone-palja">
  {{PALJA_HTML}}
</div>

<!-- Name chars (vertical stack) -->
<div class="abs zone-name">
  <div class="name-char-row">
    <div class="stroke-aside">({{last_name_strokes}})</div>
    <span class="name-han-big">{{last_name_hanja}}</span>
  </div>
  {{GIVEN_NAME_CHARS_HTML}}
</div>

<!-- Deokdam virtues -->
<div class="abs zone-deokdam">
  <div class="dd-list">
    {{DEOKDAM_HTML}}
  </div>
</div>


</body>
</html>
